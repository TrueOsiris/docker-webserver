name: Build and publish image

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  schedule:
    # every 6h: rebuild when the php base image changed, otherwise at least once a day
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the base image is unchanged
        type: boolean
        default: true

env:
  PHP_VERSION: '8.4'
  PLATFORMS: linux/amd64,linux/arm64

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
      image: ${{ steps.decide.outputs.image }}
      base_ref: ${{ steps.decide.outputs.base_ref }}
      base_digest: ${{ steps.decide.outputs.base_digest }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: decide
        env:
          FORCE: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.force) }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/webserver"
          base_ref="php:${PHP_VERSION}-apache-trixie"
          base_digest=$(docker buildx imagetools inspect "$base_ref" --format '{{json .Manifest}}' | jq -r .digest)
          {
            echo "image=$image"
            echo "base_ref=$base_ref"
            echo "base_digest=$base_digest"
          } >> "$GITHUB_OUTPUT"

          build=true
          if [ "$FORCE" != "true" ]; then
            current=$(docker buildx imagetools inspect "$image:latest" --format '{{json .Image}}' 2>/dev/null || echo '{}')
            current_base=$(jq -r '.["linux/amd64"].config.Labels["org.opencontainers.image.base.digest"] // empty' <<<"$current")
            created=$(jq -r '.["linux/amd64"].created // empty' <<<"$current")
            age=$(( $(date +%s) - $(date -d "${created:-1970-01-01}" +%s) ))
            if [ "$current_base" = "$base_digest" ] && [ "$age" -lt 72000 ]; then
              build=false
            fi
            echo "published base: ${current_base:-none}, image age: ${age}s"
          fi
          echo "upstream base:  $base_digest -> build=$build"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ${{ needs.check.outputs.image }}
      BASE_REF: ${{ needs.check.outputs.base_ref }}
      BASE_DIGEST: ${{ needs.check.outputs.base_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build test image (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          no-cache: ${{ github.event_name == 'schedule' }}
          build-args: BASE_IMAGE=${{ env.BASE_REF }}@${{ env.BASE_DIGEST }}
          platforms: linux/amd64
          load: true
          tags: webserver:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        id: test
        run: |
          set -euo pipefail
          docker volume create t-www >/dev/null
          docker volume create t-config >/dev/null
          start() {
            docker rm -f t >/dev/null 2>&1 || true
            docker run -d --name t -p 8080:80 -v t-www:/www -v t-config:/config webserver:test >/dev/null
            for _ in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:8080/ && return 0; sleep 1; done
            docker logs t; return 1
          }
          check() {
            page=$(curl -fsS http://localhost:8080/)
            grep -Eq 'PHP is working\. Version: [0-9]' <<<"$page" \
              || { echo "index.php was not executed by PHP"; exit 1; }
            [ "$(docker exec t readlink /usr/local/etc/php/php.ini)" = /config/php.ini ] \
              || { echo "php.ini is not linked to /config"; exit 1; }
            mods=$(docker exec t apache2ctl -M 2>/dev/null)
            grep -q rewrite_module <<<"$mods" \
              || { echo "mod_rewrite is not enabled"; exit 1; }
            code=$(curl -s -o /dev/null -w '%{http_code}' -F probe=1 http://localhost:8080/)
            logs=$(docker logs t 2>&1)
            if grep -q 'mitigation ENABLED' <<<"$logs"; then
              [ "$code" = 403 ] || { echo "mitigation enabled but multipart POST returned $code"; exit 1; }
            else
              [ "$code" = 200 ] || { echo "multipart POST returned $code"; exit 1; }
            fi
          }

          start; check
          echo "recreating container on the same volumes"
          start; check

          php=$(docker exec t php -r 'echo PHP_VERSION;')
          logs=$(docker logs t 2>&1)
          mitigation=$(grep -o 'PHP2Shell mitigation [A-Za-z]*' <<<"$logs" | tail -n1)
          echo "php=$php" >> "$GITHUB_OUTPUT"
          {
            echo "### Smoke test passed"
            echo "- Base: \`$BASE_REF@$BASE_DIGEST\`"
            echo "- PHP: \`$php\`"
            echo "- $mitigation"
          } >> "$GITHUB_STEP_SUMMARY"
          docker rm -f t >/dev/null

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=php${{ steps.test.outputs.php }},enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD'}},enable={{is_default_branch}}
            type=sha
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=webserver
            org.opencontainers.image.description=Apache + PHP ${{ steps.test.outputs.php }} webserver with /www and /config volumes
            org.opencontainers.image.base.name=docker.io/library/${{ env.BASE_REF }}
            org.opencontainers.image.base.digest=${{ env.BASE_DIGEST }}

      - name: Build and push (multi-arch)
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          no-cache: ${{ github.event_name == 'schedule' }}
          build-args: BASE_IMAGE=${{ env.BASE_REF }}@${{ env.BASE_DIGEST }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name != 'pull_request'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
