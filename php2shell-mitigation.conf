# Temporary mitigation for PHP2Shell (CVE-2026-109618 / CVE-2026-109619).
# Every known trigger is a multipart/form-data request, so reject them before PHP parses the body.
# This breaks file uploads. start.sh enables it only while the bundled PHP is unpatched,
# unless PHP2SHELL_MITIGATION=on|off overrides that.
<If "req('Content-Type') =~ m#multipart/form-data#i">
    Require all denied
</If>
